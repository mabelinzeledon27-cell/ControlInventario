
trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Instalar .NET 10'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restaurar dependencias'
  inputs:
    command: 'restore'
    projects: 'ControlInventario/ControlInventario.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Compilar proyecto'
  inputs:
    command: 'build'
    projects: 'ControlInventario/ControlInventario.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Publicar aplicación'
  inputs:
    command: 'publish'
    publishWebProjects: false
    modifyOutputPath: false
    projects: 'ControlInventario/ControlInventario.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: false

- task: ArchiveFiles@2
  displayName: 'Comprimir aplicación'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/ControlInventario.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Guardar artefacto'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/ControlInventario.zip'
    ArtifactName: 'ControlInventario'
    publishLocation: 'Container'

- task: AzureWebApp@1
  displayName: 'Desplegar en Azure App Service'
  inputs:
    azureSubscription: 'ConexionAzureInventario'
    appType: 'webApp'
    appName: 'control-inventario-mabe-2026'
    package: '$(Build.ArtifactStagingDirectory)/ControlInventario.zip'
    deploymentMethod: 'auto'
